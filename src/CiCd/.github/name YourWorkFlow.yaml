name: CICD

on:
    push:
      branches: ["master"] # Only on master branch
    permissions:
      content: read
    
    env:
      DOTNET_Version: "10.0.x" # Change to the version you want to use
      SOLUTION_PATH: "CICD-Template.slnx"
      OWNER: nickaphy

      jobs:
        name: Build and Test
        runs-on: ubuntu-latest
         
        steps:
        - name: Get Code
          uses: actions/checkout@v7

        - name: Setup .NET
          uses: actions/setup-dotnet@v5
          with:
            dotnet-version: ${{ env.DOTNET_VERSION }}

        - name: Restore
          run: dotnet restore ${{ env.SOLUTION_PATH }}  
    
        - name: Build
          run: dotnet build ${{ env.SOLUTION_PATH }}
          -- configuration Release
          --no-restore

        - name: Test
          run: dotnet test ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-restore
          --no-build
          --verbosity normal